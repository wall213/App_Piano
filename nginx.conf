server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Todas las rutas que no correspondan a un archivo físico redirigen a index.html
    # Esto es esencial para que funcione React Router (como el path /practice)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: Caché para archivos estáticos (JS, CSS, imágenes)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }
}
